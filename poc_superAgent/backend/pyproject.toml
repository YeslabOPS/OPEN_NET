[project]
name = "super-agent-backend"
version = "0.1.0"
description = "Super Agent 网络巡检场景 POC 后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "paramiko>=3.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "chromadb>=0.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
